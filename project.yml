name: MoodFlicker
options:
  bundleIdPrefix: com.moodflicker
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Configs/Debug.xcconfig
  Staging: Configs/Staging.xcconfig
  Release: Configs/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDevelopmentRegion: en
    INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_AppEnvironmentName: $(APP_ENVIRONMENT_NAME)
    INFOPLIST_KEY_AppAPIBaseURL: $(API_BASE_URL)
    INFOPLIST_KEY_AppWebSocketURL: $(WEB_SOCKET_URL)
    INFOPLIST_KEY_AppAPIKey: $(API_KEY)
    PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)$(BUNDLE_ID_SUFFIX)
    TARGETED_DEVICE_FAMILY: 1
packages: {}
targets:
  MoodFlicker:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: App/Resources/Colors.xcassets
        type: folder
    settings:
      base:
        PRODUCT_NAME: MoodFlicker
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.moodflicker.app
            CFBundleURLSchemes:
              - moodflicker
    entitlements:
      path: App/MoodFlicker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.moodflicker.app
    scheme:
      gatherCoverageData: true
      testTargets:
        - MoodFlickerTests
        - MoodFlickerUITests

  MoodFlickerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: MoodFlicker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests$(BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES

  MoodFlickerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
    dependencies:
      - target: MoodFlicker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests$(BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoodFlicker

  MoodFlickerWidgetExtension:
    type: appExtension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_NAME: MoodFlickerWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - @executable_path/Frameworks
          - @executable_path/../../Frameworks
        SWIFT_VERSION: 6.0
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: MoodFlicker Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - target: MoodFlicker
        embed: false
    entitlements:
      path: Widget/MoodFlickerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.moodflicker.app
